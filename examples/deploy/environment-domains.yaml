# Environment host formula example (APP_RUNTIME_TOPOLOGY_NAMING.md section 9):
# non-production hosts carry a suffix (im-test.sdkwork.com, api-test.sdkwork.com),
# production carries none (im.sdkwork.com, api.sdkwork.com).
version: 2
defaultProfile: cloud.production

profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: im-test.sdkwork.com
        tls: sdkwork.com
        mode: web
        web: adaptive
    packages: []
    overrides: {}

  cloud.staging:
    deployment:
      deploymentProfile: cloud
      environment: staging
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: im-staging.sdkwork.com
        tls: sdkwork.com
        mode: web
        web: adaptive
    packages: []
    overrides: {}

  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: im.sdkwork.com
        tls: sdkwork.com
        mode: web
        web: adaptive
    packages: []
    overrides: {}
