# Named locations for Adaptive Web (SDKWORK_DEPLOY_SPEC.md §8.1).
# REFERENCE ONLY — not included by this module's edge nginx (proxy-only).
# Included at [[http.server]] scope (siblings of location /), not inside location /.

location @pc {
    root /usr/share/sdkwork/webserver/web/pc;
    index index.html;
    try_files $uri $uri/ /index.html;
}

location @h5 {
    root /usr/share/sdkwork/webserver/web/h5;
    index index.html;
    try_files $uri $uri/ /index.html;
}
