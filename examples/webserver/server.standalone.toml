# Example standalone deltas per SDKWORK_WEBSERVER_SPEC.md: inherits
# server.common.toml; only the upstream target set differs here.
profile = "standalone"

[[http.upstream]]
name = "api_backend"
[[http.upstream.target]]
address = "127.0.0.1:3900"
weight = 1
maxFails = 3
failTimeout = "10s"
[[http.upstream.target]]
address = "127.0.0.1:3901"
weight = 1
backup = true
